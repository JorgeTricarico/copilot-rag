name: Deterministic VS Code Copilot Docs RAG Sync

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      force_recheck:
        description: "Recalcular hashes de todas las fuentes"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: pytest tests/ -v

      - name: Run Deterministic Hash Synchronizer & Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAG_WEBHOOK_URL: ${{ secrets.RAG_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.force_recheck }}" = "true" ]; then
            python scripts/copilot_docs_sync.py --output-dir ./copilot_rag_workspace --force-recheck
          else
            python scripts/copilot_docs_sync.py --output-dir ./copilot_rag_workspace
          fi

      - name: Zero-Touch Sync to Google NotebookLM
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          NOTEBOOKLM_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_NOTEBOOK_ID }}
        run: |
          python scripts/notebooklm_auto_sync.py --workspace-dir ./copilot_rag_workspace

      - name: Commit and Push only if semantic hashes changed
        run: |
          git config user.name "copilot-rag-bot"
          git config user.email "copilot-rag-bot@users.noreply.github.com"
          git add copilot_rag_workspace/
          if git diff --staged --quiet; then
            echo "Ningún hash SHA-256 cambió. No se requiere commit."
          else
            git commit -m "chore(rag): update VS Code Copilot docs bundles and state manifest [skip ci]"
            git push
          fi
